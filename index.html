<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="课表">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="icon" href="icon.svg">
<title>燕理课表 Pro</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
/* ============ 主题 ============ */
:root, [data-theme="light"]{
  --bg:#f5f7fa;
  --card:#ffffff;
  --card-2:#f7f9fc;
  --text:#0f172a;
  --text-2:#64748b;
  --text-3:#94a3b8;
  --border:#dde3ec;
  --grid-line:#d4dbe5;
  --primary:#4f46e5;
  --primary-soft:#eef2ff;
  --grad:linear-gradient(135deg,#6366f1 0%,#4f46e5 100%);
  --shadow:0 4px 24px rgba(15,23,42,.06);
  --shadow-lg:0 12px 40px rgba(15,23,42,.10);
  --tab-bg:rgba(255,255,255,.94);
}
[data-theme="dark"]{
  --bg:#0b1220;
  --card:#151d2e;
  --card-2:#1a2438;
  --text:#f1f5f9;
  --text-2:#94a3b8;
  --text-3:#64748b;
  --border:#2a3748;
  --grid-line:#2f3d54;
  --primary:#818cf8;
  --primary-soft:#1e1b4b;
  --grad:linear-gradient(135deg,#818cf8 0%,#6366f1 100%);
  --shadow:0 4px 24px rgba(0,0,0,.35);
  --shadow-lg:0 12px 40px rgba(0,0,0,.5);
  --tab-bg:rgba(21,29,46,.94);
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior-y:contain}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);font-weight:600;min-height:100vh;
  padding:14px;
  padding-top:calc(14px + env(safe-area-inset-top));
  padding-bottom:calc(88px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
  transition:background .25s,color .25s;
}
.app{max-width:1400px;margin:0 auto}

/* ============ 顶部栏 ============ */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:40px;height:40px;border-radius:11px;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;box-shadow:0 8px 20px rgba(99,102,241,.3);flex-shrink:0}
.brand>div{min-width:0}
.brand h1{font-size:18px;font-weight:900;letter-spacing:-.4px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand h1 .pro{font-size:10px;padding:2px 6px;border-radius:999px;background:var(--grad);color:#fff;vertical-align:middle;margin-left:4px;letter-spacing:.5px}
.brand p{font-size:11.5px;color:var(--text-2);font-weight:700;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.theme-toggle{width:40px;height:40px;border-radius:11px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0}
.theme-toggle:active{transform:scale(.94)}

.view{display:none}.view.active{display:block}

/* ============ 周次栏 ============ */
.week-bar{background:var(--card);border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:8px;margin-bottom:12px;box-shadow:var(--shadow);border:1px solid var(--border)}
.nav-btn{width:34px;height:34px;border-radius:9px;border:1px solid var(--border);background:var(--card);font-size:15px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text);flex-shrink:0}
.nav-btn:active{background:var(--card-2)}
.week-info{flex:1;display:flex;align-items:center;gap:8px;min-width:0;overflow:hidden}
#weekSelect{padding:7px 10px;border-radius:9px;border:1px solid var(--border);font-size:13px;font-weight:800;background:var(--card);color:var(--text);outline:none;font-family:inherit}
#weekSelect:focus{border-color:var(--primary)}
.week-range{font-size:11.5px;color:var(--text-2);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.primary-btn{padding:8px 12px;border-radius:9px;border:none;background:var(--grad);color:#fff;font-size:12.5px;font-weight:800;cursor:pointer;box-shadow:0 6px 16px rgba(99,102,241,.25);white-space:nowrap}
.primary-btn:active{transform:translateY(1px)}

/* ============ 课表网格 ============ */
.schedule-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:14px;box-shadow:var(--shadow-lg);background:var(--card);border:1px solid var(--border)}
.schedule-scroll::-webkit-scrollbar{height:6px}
.schedule-scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

.grid{
  display:grid;
  grid-template-columns:52px repeat(7,minmax(0,1fr));
  grid-template-rows:48px repeat(12, 50px);   /* 每小格 50px */
  gap:1px;
  background:var(--grid-line);               /* 网格线颜色 */
  border-radius:14px;
  overflow:hidden;
}

/* 表头 */
.grid-corner, .grid-day{
  background:var(--card-2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.grid-corner{font-size:11px;font-weight:900;color:var(--text-3)}
.grid-day{padding:4px 0;gap:2px}
.grid-day .day-name{font-size:12.5px;font-weight:900;color:var(--text);letter-spacing:-.2px;line-height:1}
.grid-day .day-date{font-size:9.5px;font-weight:800;color:var(--text-3);line-height:1}
.grid-day.weekend .day-name{color:#e11d48}
.grid-day.today{background:var(--primary-soft)}
.grid-day.today .day-name{color:var(--primary)}
.grid-day.today .day-date{color:var(--primary);opacity:.75}

/* 节次列：节/开始/结束 三行居中 */
.grid-period{
  background:var(--card-2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:0;padding:2px 0;
}
.grid-period .p-num{
  font-size:13px;font-weight:900;color:var(--text);
  line-height:1.05;
}
.grid-period .p-time{
  font-size:8px;font-weight:700;color:var(--text-3);
  line-height:1.15;letter-spacing:-0.1px;
  text-align:center;white-space:nowrap;
}

/* 空格子 */
.grid-cell{background:var(--card)}

/* 课程覆盖层：跨 2 行，全覆盖 */
.grid-course-wrap{
  padding:2px;
  display:flex;flex-direction:column;gap:2px;
  z-index:2;
}
.grid-course-wrap > *{pointer-events:auto}

/* 课程卡片 */
.course{
  flex:1;min-height:0;
  padding:8px 9px;
  border-radius:9px;
  border:1.5px solid;
  border-left-width:4px;
  font-size:11px;
  line-height:1.25;
  font-weight:700;
  overflow:hidden;
  display:flex;flex-direction:column;justify-content:center;
  cursor:pointer;
  transition:transform .12s,box-shadow .15s;
  box-shadow:0 2px 8px rgba(15,23,42,.08);
}
.course:active{transform:scale(.97)}
.course-name{font-weight:900;font-size:12px;margin-bottom:4px;line-height:1.25;word-break:break-word;overflow-wrap:anywhere}
.course-room{font-size:9.5px;font-weight:700;line-height:1.2;opacity:.88;word-break:break-word;overflow-wrap:anywhere}
.course-weeks{display:none}

/* ============ 课程详情弹窗 ============ */
.modal-overlay{
  position:fixed;inset:0;background:rgba(15,23,42,.55);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  display:none;align-items:flex-end;justify-content:center;
  z-index:200;padding:0;
}
.modal-overlay.show{display:flex;animation:fadeIn .18s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-card{
  background:var(--card);
  width:100%;max-width:520px;
  border-radius:20px 20px 0 0;
  padding:22px 20px calc(22px + env(safe-area-inset-bottom));
  box-shadow:0 -8px 40px rgba(0,0,0,.25);
  animation:slideUp .22s cubic-bezier(.2,.8,.3,1);
  max-height:85vh;overflow-y:auto;
}
.modal-header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px}
.modal-title-wrap{flex:1;min-width:0}
.modal-color-bar{height:5px;border-radius:3px;margin-bottom:10px;width:48px}
.modal-title{font-size:20px;font-weight:900;color:var(--text);letter-spacing:-.4px;line-height:1.25;word-break:break-word}
.modal-close{
  width:32px;height:32px;border-radius:9px;
  border:1px solid var(--border);background:var(--card-2);
  color:var(--text-2);font-size:20px;line-height:1;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;font-weight:400;
}
.modal-close:active{background:var(--border)}
.modal-body{display:flex;flex-direction:column;gap:12px}
.modal-row{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-top:1px solid var(--border)}
.modal-row:first-child{border-top:0;padding-top:0}
.modal-icon{
  width:36px;height:36px;border-radius:10px;
  background:var(--card-2);
  display:flex;align-items:center;justify-content:center;
  font-size:17px;flex-shrink:0;
}
.modal-info{flex:1;min-width:0}
.modal-label{font-size:11px;font-weight:800;color:var(--text-3);letter-spacing:.5px;text-transform:uppercase;margin-bottom:2px}
.modal-value{font-size:14px;font-weight:800;color:var(--text);line-height:1.4;word-break:break-word}
.modal-tag{
  display:inline-block;
  font-size:11px;font-weight:800;
  padding:2px 8px;border-radius:6px;
  background:var(--card-2);color:var(--text-2);
  margin-right:6px;margin-top:2px;
}

/* ============ 今日视图 ============ */
.today-title{font-size:13px;color:var(--text-2);font-weight:800;margin-bottom:10px;padding-left:4px}
.today-list{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.today-course{display:flex;gap:12px;padding:14px 16px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);border:1px solid var(--border);border-left:5px solid;align-items:center;cursor:pointer}
.today-course:active{transform:scale(.99)}
.today-course .time{font-size:11px;color:var(--text-2);font-weight:800;min-width:56px;text-align:center;line-height:1.4}
.today-course .time b{display:block;font-size:14px;color:var(--text);font-weight:900;margin-bottom:1px}
.today-course .info{flex:1;min-width:0}
.today-course .info h4{font-size:15px;font-weight:900;margin-bottom:4px;letter-spacing:-.2px;word-break:break-all}
.today-course .info p{font-size:11.5px;color:var(--text-2);font-weight:700;word-break:break-all}
.today-empty{padding:56px 20px;text-align:center;background:var(--card);border-radius:14px;box-shadow:var(--shadow);border:1px solid var(--border)}
.today-empty .em{font-size:42px;margin-bottom:10px}
.today-empty p{color:var(--text-2);font-size:14px;font-weight:700}

/* ============ 设置 ============ */
.settings-card{background:var(--card);border-radius:14px;padding:16px 18px;margin-bottom:12px;box-shadow:var(--shadow);border:1px solid var(--border)}
.settings-card h3{font-size:14.5px;font-weight:900;margin-bottom:6px;color:var(--text);letter-spacing:-.2px}
.settings-card h3 + .tip{margin-bottom:10px}
.field-row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-top:1px solid var(--border);font-size:13.5px;gap:10px;flex-wrap:wrap}
.field-row:first-of-type{border-top:0}
.field-row label{font-weight:800;color:var(--text);flex:1;min-width:100px}
.field-row input[type=date],.field-row input[type=number],.field-row select{padding:8px 12px;border-radius:8px;border:1px solid var(--border);font-size:13px;font-weight:700;color:var(--text);background:var(--card);outline:none;font-family:inherit;min-width:0}
.field-row input:focus,.field-row select:focus{border-color:var(--primary)}
.btn-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{padding:10px 14px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:13px;font-weight:800;cursor:pointer;font-family:inherit;transition:all .15s}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--grad);color:#fff;border:none;box-shadow:0 6px 16px rgba(99,102,241,.25)}
.tip{font-size:12px;color:var(--text-3);line-height:1.65;font-weight:700}
.tip code{background:var(--card-2);padding:1px 5px;border-radius:4px;font-family:ui-monospace,monospace;font-size:11.5px}

/* ============ 底部导航 ============ */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--tab-bg);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:100;max-width:1400px;margin:0 auto}
.tabbar button{flex:1;background:none;border:0;padding:8px 0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:800;color:var(--text-3);cursor:pointer;font-family:inherit;transition:color .15s}
.tabbar button.active{color:var(--primary)}
.tabbar svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 18px;border-radius:12px;font-size:13px;font-weight:800;z-index:999;opacity:0;transition:opacity .25s;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.2);max-width:88vw;text-align:center}
[data-theme="dark"] .toast{background:#334155;color:#f1f5f9}
.toast.show{opacity:1}

/* ============ 平板 ============ */
@media (max-width:768px){
  body{padding:10px;padding-top:calc(10px + env(safe-area-inset-top));padding-bottom:calc(84px + env(safe-area-inset-bottom))}
  .brand h1{font-size:16px}.brand p{font-size:10.5px}
  .logo{width:36px;height:36px;font-size:16px;border-radius:10px}
  .theme-toggle{width:36px;height:36px;font-size:16px;border-radius:10px}
  .week-bar{padding:8px 10px;gap:6px}
  .nav-btn{width:32px;height:32px;font-size:14px}
  #weekSelect{font-size:12.5px;padding:6px 8px}
  .primary-btn{padding:7px 10px;font-size:12px}
  .week-range{display:none}
  .today-course{padding:12px 14px;gap:10px}
  .today-course .time{min-width:50px}
  .today-course .time b{font-size:13px}
  .today-course .info h4{font-size:14px}
  .field-row{flex-direction:column;align-items:flex-start;gap:6px}
  .field-row input,.field-row select{width:100%}
  .btn-row .btn{flex:1;min-width:120px}
}

/* ============ iQOO 12 / 窄屏 ============ */
@media (max-width:480px){
  .grid{
    grid-template-columns:46px repeat(7,minmax(0,1fr));
    grid-template-rows:46px repeat(12, 50px);
  }
  .grid-day .day-name{font-size:12px}
  .grid-day .day-date{font-size:9px}
  .grid-period .p-num{font-size:12px}
  .grid-period .p-time{font-size:7.5px;letter-spacing:-0.2px}
  .grid-course-wrap{padding:2px}
  .course{padding:6px 6px;border-radius:7px;border-left-width:3.5px;font-size:10.5px}
  .course-name{font-size:10.5px;margin-bottom:3px}
  .course-room{font-size:9px}
}
</style>
</head>
<body>

<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="logo">课</div>
      <div>
        <h1>燕理课表 <span class="pro">PRO</span></h1>
        <p id="metaInfo">计应（专）2607专 · 2026-2027-1</p>
      </div>
    </div>
    <button class="theme-toggle" id="themeToggle" title="切换主题">🌙</button>
  </header>

  <section id="view-today" class="view">
    <div class="today-title" id="todayTitle"></div>
    <div class="today-list" id="todayList"></div>
  </section>

  <section id="view-schedule" class="view active">
    <div class="week-bar">
      <button class="nav-btn" id="prevWeek">←</button>
      <div class="week-info">
        <select id="weekSelect"></select>
        <span class="week-range" id="weekRange"></span>
      </div>
      <button class="nav-btn" id="nextWeek">→</button>
      <button class="primary-btn" id="todayBtn">本周</button>
    </div>
    <div class="schedule-scroll">
      <div class="grid" id="grid"></div>
    </div>
  </section>

  <section id="view-settings" class="view">
    <div class="settings-card">
      <h3>学期设置</h3>
      <div class="field-row">
        <label>第 1 周周一</label>
        <input type="date" id="semStart">
      </div>
      <div class="field-row">
        <label>学期总周数</label>
        <input type="number" id="totalWeeks" min="1" max="30">
      </div>
      <div class="tip">改完点最下方"保存设置"。</div>
    </div>

    <div class="settings-card">
      <h3>🔔 课表提醒</h3>
      <div class="tip" style="margin-bottom:10px">推荐导出 <code>.ics</code> 到手机<b>系统日历</b>，到点锁屏也会响。</div>
      <div class="btn-row">
        <button class="btn primary" id="exportICS">导出到系统日历</button>
      </div>
      <div class="field-row" style="margin-top:14px">
        <label>提醒提前量</label>
        <select id="alarmMin">
          <option value="5">5 分钟</option>
          <option value="10" selected>10 分钟</option>
          <option value="15">15 分钟</option>
          <option value="30">30 分钟</option>
        </select>
      </div>
      <hr style="border:0;border-top:1px solid var(--border);margin:14px 0">
      <div class="field-row">
        <label>页面内通知</label>
        <button class="btn" id="enableNotif">开启</button>
      </div>
    </div>

    <div class="settings-card">
      <h3>📥 数据管理</h3>
      <div class="btn-row">
        <button class="btn primary" id="importExcelBtn">导入 Excel</button>
        <input type="file" id="fileInput" accept=".xlsx,.xls" hidden>
        <button class="btn" id="exportJSON">导出备份</button>
        <button class="btn" id="importJSONBtn">导入备份</button>
        <input type="file" id="jsonInput" accept=".json" hidden>
      </div>
      <div class="tip" style="margin-top:10px">换手机时导出备份，在新机导入即可。</div>
    </div>

    <div class="settings-card">
      <h3>ℹ️ 关于</h3>
      <div class="tip">燕理课表 Pro · 本地 PWA<br>数据保存在本机浏览器，不上传服务器。</div>
    </div>

    <button class="btn primary" id="saveSettings" style="width:100%;padding:14px;font-size:14px">保存设置</button>
  </section>
</div>

<nav class="tabbar">
  <button data-view="today" id="tab-today">
    <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    <span>今日</span>
  </button>
  <button data-view="schedule" class="active" id="tab-schedule">
    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
    <span>周课表</span>

const hueCache = {};
function getHue(name){
  if(hueCache[name] !== undefined) return hueCache[name];
  let h = 0;
  for(let i=0;i<name.length;i++) h = name.charCodeAt(i) + ((h<<5)-h);
  const hue = Math.abs(h) % 360;
  hueCache[name] = hue;
  return hue;
}
function courseColors(name){
  const hue = getHue(name);
  const isDark = document.documentElement.dataset.theme === 'dark';
  if(isDark){
    /* 暗色：底色更饱和，边框更亮，文字接近白 */
    return {
      bg:`hsl(${hue}, 48%, 26%)`,
      border:`hsl(${hue}, 70%, 58%)`,
      text:`hsl(${hue}, 92%, 95%)`,
    };
  } else {
    return {
      bg:`hsl(${hue}, 78%, 96%)`,
      border:`hsl(${hue}, 62%, 70%)`,
      text:`hsl(${hue}, 60%, 28%)`,
    };
  }
}
function formatWeeks(weeks){
  if(!weeks || !weeks.length) return '';
  const ranges = [];
  let s = weeks[0], e = weeks[0];
  for(let i=1;i<weeks.length;i++){
    if(weeks[i] === e+1){ e = weeks[i]; }
    else { ranges.push(s === e ? `${s}` : `${s}-${e}`); s = e = weeks[i]; }
  }
  ranges.push(s === e ? `${s}` : `${s}-${e}`);
  return ranges.join(',') + '周';
}
function calcCurrentWeek(){
  const start = new Date(state.semesterStart + 'T00:00:00');
  const now = new Date(); now.setHours(0,0,0,0);
  const diff = Math.floor((now - start)/86400000);
  return Math.max(1, Math.min(state.totalWeeks, Math.floor(diff/7)+1));
}
function weekDateRange(w){
  const start = new Date(state.semesterStart + 'T00:00:00');
  start.setDate(start.getDate() + (w-1)*7);
  const end = new Date(start); end.setDate(start.getDate()+6);
  return [start, end];
}

/* ============ Excel 解析 ============ */
function parseWeeks(str){
  const set = new Set();
  str.split(',').forEach(part => {
    part = part.trim(); if(!part) return;
    const m = part.match(/^(\d+)\s*-\s*(\d+)$/);
    if(m){ for(let i=+m[1];i<=+m[2];i++) set.add(i); }
    else if(/^\d+$/.test(part)) set.add(+part);
  });
  return [...set].sort((a,b)=>a-b);
}
function parseCourseLine(line){
  const parts = line.split('◇').map(s=>s.trim()).filter(Boolean);
  if(parts.length < 3) return null;
  const nameMatch = parts[0].match(/^(.+?)\[(.+?)\]\[(.+?)\]$/);
  if(!nameMatch) return null;
  const weekMatch = parts[1].match(/^(.+?)\(周\)\[(.+?)\]$/);
  if(!weekMatch) return null;
  return {
    name:nameMatch[1].trim(), credit:nameMatch[2].trim(), type:nameMatch[3].trim(),
    weeks:parseWeeks(weekMatch[1]), periodStr:weekMatch[2].trim(), room:parts[2].trim(),
  };
}
function parseExcelData(data){
  let headerIdx = -1;
  for(let i=0;i<data.length;i++){
    if(data[i].some(c => String(c).includes('星期一'))){ headerIdx = i; break; }
  }
  if(headerIdx === -1) throw new Error('未找到表头');
  const dayCol = {};
  const header = data[headerIdx];
  const dayMap = {'星期一':1,'星期二':2,'星期三':3,'星期四':4,'星期五':5,'星期六':6,'星期天':7,'星期日':7};
  for(let j=0;j<header.length;j++){
    const cell = String(header[j]).trim();
    for(const [n,d] of Object.entries(dayMap)){
      if(cell.includes(n)){ dayCol[d] = j; break; }
    }
  }
  const courses = [];
  const periodNames = ['第一大节','第二大节','第三大节','第四大节','第五大节','第六大节'];
  for(let i=headerIdx+1;i<data.length;i++){
    const row = data[i];
    let period = -1;
    for(let j=0;j<Math.min(3,row.length);j++){
      const cell = String(row[j]).trim();
      if(periodNames.includes(cell)){ period = periodNames.indexOf(cell)+1; break; }
    }
    if(period === -1) continue;
    for(const [dStr, col] of Object.entries(dayCol)){
      const cell = String(row[col] || '').trim();
      if(!cell) continue;
      cell.split(/<br\s*\/?>|\n/).map(s=>s.trim()).filter(Boolean)
        .map(parseCourseLine).filter(Boolean)
        .forEach(c => courses.push({ ...c, day:+dStr, period }));
    }
  }
  return courses;
}

/* ============ 导出 .ics ============ */
function icsTime(d){
  return d.getFullYear() + pad(d.getMonth()+1) + pad(d.getDate()) +
    'T' + pad(d.getHours()) + pad(d.getMinutes()) + '00';
}
function escapeICS(s){
  return String(s).replace(/\\/g,'\\\\').replace(/,/g,'\\,').replace(/;/g,'\\;').replace(/\n/g,'\\n');
}
function generateICS(){
  const lines = [
    'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//YanliCourseTable//CN',
    'CALSCALE:GREGORIAN','METHOD:PUBLISH',
    'X-WR-CALNAME:我的课表','X-WR-TIMEZONE:Asia/Shanghai',
  ];
  const startDate = new Date(state.semesterStart + 'T00:00:00');
  let uid = Date.now();
  const alarm = state.alarmMin || 10;
  state.courses.forEach(c => {
    const [sh,sm] = PERIOD_TIMES[c.period].clock[0].split(':').map(Number);
    const [eh,em] = PERIOD_TIMES[c.period].clock[1].split(':').map(Number);
    c.weeks.forEach(w => {
      const day = new Date(startDate);
      day.setDate(day.getDate() + (w-1)*7 + (c.day-1));
      const start = new Date(day); start.setHours(sh, sm, 0, 0);
      const end = new Date(day); end.setHours(eh, em, 0, 0);
      lines.push('BEGIN:VEVENT');
      lines.push('UID:' + (uid++) + '@coursetable');
      lines.push('DTSTAMP:' + icsTime(new Date()));
      lines.push('DTSTART:' + icsTime(start));
      lines.push('DTEND:' + icsTime(end));
      lines.push('SUMMARY:' + escapeICS(c.name));
      lines.push('LOCATION:' + escapeICS(c.room));
      lines.push('DESCRIPTION:' + escapeICS(`${c.type} · ${c.credit}学时 · 第${w}周`));
      lines.push('BEGIN:VALARM');
      lines.push('TRIGGER:-PT' + alarm + 'M');
      lines.push('ACTION:DISPLAY');
      lines.push('DESCRIPTION:' + escapeICS(c.name + ' 即将开始'));
      lines.push('END:VALARM');
      lines.push('END:VEVENT');
    });
  });
  lines.push('END:VCALENDAR');
  return lines.join('\r\n');
}
function download(filename, content, mime){
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/* ============ 页面内通知 ============ */
let notifTimer = null;
const notifiedKeys = new Set();
function startNotifLoop(){
  if(notifTimer) clearInterval(notifTimer);
  notifTimer = setInterval(checkUpcoming, 30000);
  checkUpcoming();
}
function checkUpcoming(){
  if(!('Notification' in window) || Notification.permission !== 'granted') return;
  const now = new Date();
  const day = todayDayIndex();
  const week = calcCurrentWeek();
  const lead = (state.alarmMin || 10) * 60000;
  state.courses
    .filter(c => c.day === day && c.weeks.includes(week))
    .forEach(c => {
      const [sh,sm] = PERIOD_TIMES[c.period].clock[0].split(':').map(Number);
      const start = new Date();
      start.setHours(sh, sm, 0, 0);
      const diff = start - now;
      if(diff > 0 && diff <= lead){
        const key = `${c.name}-${c.day}-${c.period}-${start.getTime()}`;
        if(notifiedKeys.has(key)) return;
        notifiedKeys.add(key);
        new Notification('即将上课：' + c.name, {
          body: `${c.room} · ${PERIOD_TIMES[c.period].label}`,
          icon: './icon.svg',
          tag: key,
        });
      }
    });
}

/* ============ 事件绑定 ============ */
document.querySelectorAll('.tabbar button').forEach(b => {
  b.onclick = () => switchView(b.dataset.view);
});
document.getElementById('prevWeek').onclick = () => {
  if(state.currentWeek > 1){ state.currentWeek--; refresh(); }
};
document.getElementById('nextWeek').onclick = () => {
  if(state.currentWeek < state.totalWeeks){ state.currentWeek++; refresh(); }
};
document.getElementById('weekSelect').onchange = e => {
  state.currentWeek = +e.target.value; refresh();
};
document.getElementById('todayBtn').onclick = () => {
  state.currentWeek = calcCurrentWeek(); refresh();
  toast('已定位到第 ' + state.currentWeek + ' 周');
};
document.getElementById('saveSettings').onclick = () => {
  const s = document.getElementById('semStart').value;
  const t = +document.getElementById('totalWeeks').value;
  const a = +document.getElementById('alarmMin').value;
  if(s) state.semesterStart = s;
  if(t > 0) state.totalWeeks = t;
  state.alarmMin = a;
  state.currentWeek = calcCurrentWeek();
  saveState();
  refresh();
  toast('设置已保存');
};
document.getElementById('exportICS').onclick = () => {
  if(!confirm('将导出 .ics 文件，导入手机系统日历后即可准时提醒。继续？')) return;
  download('我的课表.ics', generateICS(), 'text/calendar;charset=utf-8');
  toast('已导出，请到手机日历导入');
};
document.getElementById('enableNotif').onclick = async () => {
  if(!('Notification' in window)){ toast('此浏览器不支持通知'); return; }
  const p = await Notification.requestPermission();
  if(p === 'granted'){ toast('通知已开启'); startNotifLoop(); }
  else { toast('未授权通知'); }
};
document.getElementById('importExcelBtn').onclick = () => document.getElementById('fileInput').click();
document.getElementById('fileInput').onchange = e => {
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try{
      const wb = XLSX.read(ev.target.result, { type:'array' });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const data = XLSX.utils.sheet_to_json(sheet, { header:1, defval:'' });
      const courses = parseExcelData(data);
      if(!courses.length){ toast('未解析到课程'); return; }
      state.courses = courses;
      saveState();
      refresh();
      toast(`导入成功，共 ${courses.length} 条`);
    }catch(err){ toast('解析失败：' + err.message); }
  };
  reader.readAsArrayBuffer(file);
  e.target.value = '';
};
document.getElementById('exportJSON').onclick = () => {
  download('课表备份.json', JSON.stringify(state, null, 2), 'application/json');
  toast('备份已导出');
};
document.getElementById('importJSONBtn').onclick = () => document.getElementById('jsonInput').click();
document.getElementById('jsonInput').onchange = e => {
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try{
      const obj = JSON.parse(ev.target.result);
      state = { ...DEFAULT_STATE, ...obj };
      saveState();
      refresh();
      fillSettingsForm();
      toast('备份已恢复');
    }catch(err){ toast('导入失败：' + err.message); }
  };
  reader.readAsText(file);
  e.target.value = '';
};

/* ============ 初始化 ============ */
function fillSettingsForm(){
  document.getElementById('semStart').value = state.semesterStart;
  document.getElementById('totalWeeks').value = state.totalWeeks;
  document.getElementById('alarmMin').value = state.alarmMin;
}
initTheme();
state.currentWeek = calcCurrentWeek();
fillSettingsForm();
refresh();

if(window.innerWidth <= 768){
  switchView('today');
} else {
  switchView('schedule');
}

if('serviceWorker' in navigator && location.protocol !== 'file:'){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
if('Notification' in window && Notification.permission === 'granted'){
  startNotifLoop();
}
</script>
